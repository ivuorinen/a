# Tool versions for this repository.
#
# The single source of tool versions: the Justfile runs these binaries locally,
# and test.yml and release.yml install them through jdx/mise-action, so a local
# run and CI execute the same versions.
#
# Two pins still live elsewhere, and the comments below say where: go.mod's
# `toolchain` line, and the `rev` of the pre-commit hooks for the three linters
# the Justfile also calls directly. When you bump one, bump its counterpart too
# or the two will silently disagree.
#
# Tasks live in the Justfile (`just --list`), not here.

[tools]

# --- language toolchain -------------------------------------------------------
# Must match the `toolchain` line in go.mod -- not the `go` directive, which is
# the *minimum* language version the code builds against (1.26.0, the floor the
# golang.org/x deps set -- x/crypto, x/sys and x/term all declare `go 1.26.0`
# from v0.56.0 on, so the advisory fix in that release moved the floor with it).
# A Go newer than the analyzers below can break them: a linter built with an
# older Go refuses a module targeting a newer one ("the Go language version used
# to build golangci-lint is lower than the targeted Go version").
go = "1.27.3"

# --- Go static analysis --------------------------------------------------------
# Its .golangci.yml enables 27 linters, gosec and staticcheck among them, so the
# two standalone entries below are for running a single analyzer directly.
golangci-lint = "2.15.0"
staticcheck = "2026.2.2"
# github: rather than aqua: -- both resolve to a byte-identical binary, but the
# github backend verifies the release's GitHub artifact attestations, where aqua
# only checks a checksum. gosec has no plain registry entry either way.
"github:securego/gosec" = "v2.30.0"
# No aqua/registry entry, so this builds from source with the Go pinned above.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# Branch and condition coverage, which `go test -cover` does not measure: it
# counts statements, so `a && b` is covered by one evaluation and an `if` with no
# `else` has no block for its false path. scripts/check-conditions.sh runs it.
"go:github.com/rillig/gobco" = "1.3.4"

# --- formatters and linters the Justfile calls directly ------------------------
# These versions match the corresponding `rev` in .pre-commit-config.yaml, so
# `just lint` and `just precommit` cannot disagree about the same file. shfmt,
# shellcheck, actionlint and checkov are deliberately absent: only their
# pre-commit hooks run them, and each hook installs its own binary.
"npm:markdownlint-cli" = "0.50.0" # pre-commit rev v0.50.0
yamllint = "1.38.0"               # pre-commit rev v1.38.0
yamlfmt = "0.21.0"                # pre-commit rev v0.21.0
# `just format` runs goimports directly; golangci-lint also applies it as a
# formatter, so keep this current with whatever that bundles.
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"

# --- build, release, and hooks -------------------------------------------------
just = "1.59.0"
goreleaser = "2.19.0"
# `just precommit` prefers prek and falls back to pre-commit; pinning prek here
# means the fallback is never needed.
prek = "0.5.7"
# goreleaser shells out to these during `just release` and in release.yml:
# `signs.cmd: cosign` and the `sboms` block (syft). Without them a local release
# run skips or fails those stages, so a snapshot build would not exercise what CI
# does.
cosign = "3.1.4"
syft = "1.55.0"

[settings]
# Every tool here is pinned explicitly, so mise has no reason to also read a
# version out of go.mod. Reading it is deprecated anyway (mise removes the
# go.mod `go` directive as a version source in 2026.11.0): that directive is a
# minimum compatible version, not the version the project is built with.
idiomatic_version_file_enable_tools = []
