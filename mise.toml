# Tool versions for this repository.
#
# The one place tool versions are pinned, except Go, which mise reads from
# go.mod (see [settings]). The tasks in .mise/tasks/, the git hooks in
# .pre-commit-config.yaml and the workflows in .github/workflows/ all run these
# binaries through mise, so a local run, a commit hook and CI execute the same
# versions.
#
# After changing a version here or go.mod's `toolchain` line, run `mise lock`
# and commit mise.lock: CI installs with `--locked`, which fails on a version
# the lockfile does not list.
#
# Tasks live in .mise/tasks/ (`mise tasks ls`).

[tools]

# --- Go static analysis --------------------------------------------------------
# .golangci.yml enables 27 linters, gosec and staticcheck among them, and its
# gofmt, goimports and golines formatters rewrite files as it runs. A go.mod
# toolchain newer than the Go this binary was built with makes it refuse the
# module ("the Go language version used to build golangci-lint is lower than
# the targeted Go version"), so a toolchain bump may need a golangci-lint bump.
golangci-lint = "2.15.0"
# No aqua/registry entry, so this builds from source with go.mod's Go.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# Branch and condition coverage, which `go test -cover` does not measure: it
# counts statements, so `a && b` is covered by one evaluation and an `if` with no
# `else` has no block for its false path. The `conditions` and `branches` tasks
# run it.
"go:github.com/rillig/gobco" = "1.3.4"

# --- formatters and linters the git hooks run ------------------------------------
"npm:markdownlint-cli" = "0.50.0"
yamllint = "1.38.0"
yamlfmt = "0.21.0"
shfmt = "3.14.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
checkov = "3.4.0"

# --- runtimes for the linters above ----------------------------------------------
# markdownlint-cli runs on node (it needs >=22). mise installs yamllint with
# `uv tool install` and passes it this python, so neither depends on what the
# machine has installed. Python stays on 3.14 until PyYAML, yamllint's parser,
# publishes 3.15 wheels; on 3.15 uv would build it from source.
node = "26.13.0"
python = "3.14.10"
uv = "0.13.7"

# --- build and release ---------------------------------------------------------
goreleaser = "2.19.0"
# Runs .pre-commit-config.yaml, both as the git hook and as `mise run lint`.
prek = "0.5.9"
# goreleaser shells out to these during `mise run release` and in release.yml:
# `signs.cmd: cosign` and the `sboms` block (syft). Without them a local release
# run skips or fails those stages, so a snapshot build would not exercise what CI
# does.
cosign = "3.1.4"
syft = "1.55.0"

[settings]
# Go has no entry in [tools]: mise reads its version from go.mod instead, so
# go.mod is the only place it is pinned. mise takes the `toolchain goX.Y.Z` line
# as an exact version. Without that line it falls back to the `go` directive,
# but only a patch-level `go X.Y.Z`; from 2026.11.0 it ignores a bare `go X.Y`.
# The `go` directive is the *minimum* language version the code builds against
# (1.26.0, the floor the golang.org/x deps set), not the version CI builds with.
idiomatic_version_file_enable_tools = ["go"]
