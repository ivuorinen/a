---
extends: default

# Reuse .gitignore rather than keep a second list: build output such as dist/ is
# generated by `just release`, never edited by hand, and made `just lint` carry
# a standing warning locally that CI never sees. yamlfmt honors the same file
# via gitignore_excludes.
ignore-from-file: .gitignore

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  trailing-spaces:
    level: warning
