---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
# GoReleaser configuration
# Documentation: https://goreleaser.com/customization/
version: 2

# Set the project name
project_name: a

# Clean dist folder before build
before:
  hooks:
    - go mod tidy

# Build configuration
builds:
  - id: a
    main: .
    binary: a

    # Custom ldflags. `version` in main is a plain uninitialized string so -X can
    # patch it -- cmd/link only patches a variable that is uninitialized or set to
    # a constant, so giving it a function initializer makes this a silent no-op.
    # commit/date/builtBy were dropped as they were never surfaced anywhere.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

    # Build for multiple platforms
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
      - netbsd

    goarch:
      - amd64
      - arm64
      - arm
      - "386"

    goarm:
      - "6"
      - "7"

    # Skip certain combinations
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: netbsd
        goarch: arm

    # Set environment variables
    env:
      - CGO_ENABLED=0

    # Custom build tags
    tags:
      - netgo
      - osusergo

# Archive configuration
archives:
  - id: a
    formats: ["binary", "tar.gz"]

    # Files to include in archive. Do NOT reinstate a docs/* glob: docs/ holds the
    # audit findings store, so the glob shipped the project's own defect log --
    # open findings included -- to every user who downloaded a tarball.
    files:
      - LICENSE.md
      # Required by the BSD-3/Apache-2.0 dependencies linked into the binary;
      # LICENSE.md is the project's own MIT terms and does not cover them.
      # Regenerate with `just notices` when the module set changes.
      - THIRD_PARTY_NOTICES.md
      - README.md

# Checksum configuration
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless-sign the checksums file with cosign via Sigstore (Fulcio + Rekor). The
# OIDC identity comes from the workflow's id-token; no long-lived keys are stored.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Generate SBOMs for the release archives with syft.
sboms:
  - id: archive
    artifacts: archive

# Snapshot configuration
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release configuration
release:
  github:
    owner: ivuorinen
    name: a

  # Release notes.
  #
  # These are hardening fixes, not API breaks: each replaces a path that lost
  # data or failed open, and the one importable-surface change (cmd ->
  # internal/cmd) had no consumers — this is a CLI with no documented Go API.
  # They are listed here rather than left to the grouped changelog because the
  # commits that made them (28f8e35) are typed `refactor:`, so `changelog.groups`
  # files them under "♻️ Refactoring", and two of them need the reader to do
  # something on upgrade. Drop this block once it has shipped in a release.
  header: |
    ## a v{{ .Version }} ({{ .Date }})

    A robust command-line interface (CLI) wrapper around the age encryption tool

    ### Behaviour changes since v1.0.0

    Hardening fixes, each replacing a path that lost data or failed open. Two
    need action on upgrade:

    - `encrypt` and `decrypt` refuse to replace an existing output file, which
      previously destroyed the old ciphertext or reverted a newer plaintext
      silently, with exit 0. Pass `-f` / `--force` where that was intended.
    - A config file that is group- or other-accessible is refused, and `a`
      prints the `chmod` to apply. Existing configs may need it once.

    The rest need nothing:

    - An argument a command cannot place is now an error. `a encrypt -i file user`
      previously ignored `user` and exited 0, producing a file the requested
      recipient could not open.
    - A GitHub user whose keys cannot be fetched is an error rather than a
      warning, instead of encrypting without the requested recipient.
    - The default log path follows `$XDG_STATE_HOME` instead of `~/.state`,
      which no specification defines.
    - The `cmd` package moved to `internal/cmd`.

  footer: |
    ## Installation

    ### Using Go
    ```bash
    go install github.com/ivuorinen/a@latest
    ```

    ### Manual Download
    Download the appropriate binary for your platform from the assets below.

    ## Documentation

    See the [README](https://github.com/ivuorinen/a#readme) for usage instructions.

  # Automatically generate release notes

  make_latest: true

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "typo"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "🚀 Features"
      regexp: "^feat"
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
    - title: "🔒 Security"
      regexp: "^security"
    - title: "⚡ Performance"
      regexp: "^perf"
    - title: "♻️ Refactoring"
      regexp: "^refactor"
    - title: "Other changes"

# NFPM configuration for Linux packages
nfpms:
  - id: a
    package_name: a
    vendor: ivuorinen
    homepage: https://github.com/ivuorinen/a
    maintainer: ivuorinen
    description: CLI wrapper for age encryption using SSH and GitHub keys
    license: MIT

    formats:
      - deb
      - rpm
      - apk

    bindir: /usr/bin

    contents:
      - src: ./LICENSE.md
        dst: /usr/share/doc/a/LICENSE.md
      - src: ./THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/a/THIRD_PARTY_NOTICES.md
      - src: ./README.md
        dst: /usr/share/doc/a/README.md

# Docker configuration (buildx-based, replaces the deprecated dockers/docker_manifests)
dockers_v2:
  - images:
      - "ghcr.io/ivuorinen/a"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: Dockerfile
    # The image redistributes the same statically linked deps as the archives,
    # so it carries the same notices; Dockerfile COPYs it from the build context.
    extra_files:
      - THIRD_PARTY_NOTICES.md
    # amd64 only, matching the pre-migration image; add linux/arm64 here for a multi-arch manifest (arm64 binaries already build)
    platforms:
      - linux/amd64
    flags:
      - "--pull=true" # always refresh the alpine base, matching the old --pull build flag
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
