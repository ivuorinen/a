---
# This file pins no versions. The builtin hooks ship with prek, and every local
# hook runs a binary pinned in mise.toml, so the git hook, `mise run lint` and
# CI's Lint job run the same versions. Entries go through `mise exec --` so a
# commit made from a shell without mise activated still finds the binaries.
repos:
  - repo: builtin
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]

  - repo: local
    hooks:
      # golangci-lint also formats: .golangci.yml enables gofmt, goimports and
      # golines with `fix: true`, so no separate gofmt hook is needed.
      - id: go-build
        name: go build
        entry: mise exec -- go build -o /dev/null ./...
        language: system
        files: (\.go$)|(\bgo\.mod$)
        pass_filenames: false
        require_serial: true
      - id: go-mod-tidy
        name: go mod tidy
        entry: mise exec -- go mod tidy
        language: system
        files: (\.go$)|(\bgo\.mod$)
        pass_filenames: false
        require_serial: true
      - id: golangci-lint
        name: golangci-lint
        entry: mise exec -- golangci-lint run
        language: system
        files: (\.go$)|(\bgo\.mod$)
        pass_filenames: false
        require_serial: true
      - id: yamlfmt
        name: yamlfmt
        entry: mise exec -- yamlfmt
        language: system
        types: [yaml]
      - id: markdownlint
        name: markdownlint
        entry: mise exec -- markdownlint -c .markdownlint.json --fix
        language: system
        types: [markdown]
      - id: yamllint
        name: yamllint
        entry: mise exec -- yamllint
        language: system
        types: [file, yaml]
      - id: shfmt
        name: shfmt
        entry: mise exec -- shfmt --write
        language: system
        types: [shell]
        exclude_types: [csh, tcsh]
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck --severity=warning
        language: system
        types: [shell]
      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint -shellcheck=
        language: system
        types: [yaml]
        files: ^\.github/workflows/
      - id: checkov
        name: checkov
        # The workflows are the IaC surface here, so trigger on those. Upstream's
        # hook gated on `files: \.tf$`; with no Terraform in this repo that meant
        # it silently never ran -- "Skipped", which reads like "Passed" in a hook
        # summary. checkov ignores filenames and always scans `-d .`.
        entry: mise exec -- checkov -d . --quiet
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
        require_serial: true
