---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]

  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: 497f8ebf9d58162bb5898e3973a633d31d511169 # frozen: v0.0.5
    hooks:
      - id: sync-pre-commit-deps

  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: f298c082154b2cb239fac06a4f452368e66e66dd # frozen: v1.0.0-rc.4
    hooks:
      - id: go-build-mod
        alias: build
      - id: go-mod-tidy
        alias: tidy
      - id: golangci-lint-mod
        alias: lint
      - id: go-fmt
        alias: fmt
        args: [-s, -w]

  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # frozen: v0.50.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.json, --fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d # frozen: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 9504d068f8411b04a0ad67099d0d302242ba7d43 # frozen: 3.4.0
    hooks:
      - id: checkov
        # Upstream gates this hook on `files: \.tf$`; with no Terraform in this
        # repo that meant it silently never ran -- "Skipped", which reads like
        # "Passed" in a hook summary. The workflows are the IaC surface here,
        # so trigger on those. The hook ignores filenames (pass_filenames: false)
        # and always scans `-d .`.
        files: ^\.github/workflows/.*\.ya?ml$
        args:
          - "--quiet"
