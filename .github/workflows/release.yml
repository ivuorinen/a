---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# One release per tag; never cancel a release that is mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      id-token: write # OIDC token for keyless cosign/Sigstore signing
    env:
      # Go, GoReleaser, and the cosign and syft binaries GoReleaser shells out to
      # (`signs`, `sboms`). Limits both the install and `mise run`, which would
      # otherwise install every tool in mise.toml.
      MISE_ENABLE_TOOLS: go,goreleaser,cosign,syft
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # GoReleaser authenticates via GITHUB_TOKEN, not the persisted git credential

      - name: Install the release toolchain from mise.toml
        # The versions `mise run release` uses locally.
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.22
          cache: false # release builds must not trust a cache poisonable from lower-privilege runs

      - name: Run GoReleaser
        run: mise run release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
