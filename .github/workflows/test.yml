---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {} # least privilege by default; the job grants only what it needs
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest # ships ssh-keygen, which the key-generating tests need
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Lint
        # .golangci.yml enables 27 linters that nothing ran: golangci-lint is in no
        # workflow, and pr-lint.yml's MegaLinter allow-list contains no Go linter.
        # --fix=false overrides `issues.fix: true` in .golangci.yml so CI reports
        # instead of rewriting the source it is meant to be checking.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --fix=false

      - name: Check third-party notices are current
        # The notices file is generated from the module set and ships in every
        # release artifact, so a dependency bump that forgets `just notices`
        # publishes attribution for the wrong versions -- or omits a new
        # dependency's license entirely. Regenerate and diff.
        # git status --porcelain, not git diff --exit-code: diff only compares
        # tracked files, so it silently passes if the file is untracked or was
        # removed from git -- which is the same compliance gap as a stale one.
        run: |
          ./scripts/gen-notices.sh
          if [ -n "$(git status --porcelain -- THIRD_PARTY_NOTICES.md)" ]; then
            git --no-pager diff -- THIRD_PARTY_NOTICES.md
            echo "::error::THIRD_PARTY_NOTICES.md is stale or untracked - run 'just notices' and commit"
            exit 1
          fi

      - name: Assert the runner provides ssh-keygen
        # The key-generating tests call t.Skip when it is missing, and Go reports
        # a skipped test as `ok` -- so losing it would silently void every
        # passphrase-protected-key test plus TestCLIIntegration, the only thing
        # that covers main(), behind a green run.
        run: command -v ssh-keygen

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check dependencies for known vulnerabilities
        # golangci-lint's gosec audits this repo's source; nothing audited the
        # modules it links, so x/crypto sat two minors behind two fixed ssh
        # advisories unnoticed. Version matches mise.toml, so `just vuln` and
        # this step are the same check.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check every condition is evaluated both ways
        # `go test -cover` counts statements, so a compound condition is marked
        # covered by a single evaluation and an `if` with no `else` has no block
        # for its false path. The suite hit 100% statement coverage with two
        # conditions still never observed both ways. The script wraps gobco
        # because gobco exits 0 even when it reports gaps.
        run: ./scripts/check-conditions.sh

      - name: Cross-compile every released target
        # .goreleaser.yml builds 5 GOOS x 4 GOARCH, but the job above only ever
        # compiles linux/amd64. Without this, a pushed v*.*.* tag is the first
        # build of any other target and a failure lands after the tag is public,
        # in a job holding contents:write. Build only; the tests stay on linux.
        run: |
          for target in darwin/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 \
                        netbsd/amd64 linux/arm64 linux/arm linux/386; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./... \
              || { echo "::error::build failed for $target"; exit 1; }
          done
