---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate artifacts
# Two generated files go stale on Renovate's branches:
#   - THIRD_PARTY_NOTICES.md, when a PR moves the module set; test.yml's notices
#     check then fails it.
#   - mise.lock, when a PR bumps go.mod's `toolchain` line, which is where mise
#     reads the Go version. Renovate's gomod manager does not touch mise.lock,
#     and CI installs with `--locked`, so every job would fail on a Go version
#     the lockfile does not list.
# Renovate's own mechanism for this, postUpgradeTasks, does not run here: the
# Mend-hosted app only executes commands Mend has allowlisted. This regenerates
# both files on Renovate's branches instead.
on:
  push:
    branches: ["renovate/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {} # GITHUB_TOKEN gets nothing; checkout and push use FIXIMUS_TOKEN
jobs:
  artifacts:
    name: Regenerate mise.lock and third-party notices
    # No `github.actor == 'renovate[bot]'` gate: the actor is spoofable (zizmor
    # bot-conditions), and it never guarded FIXIMUS_TOKEN -- anyone who can push
    # to renovate/** can read that secret from a workflow of their own. This
    # job's own push starts one more run, which finds both files current and exits.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `mise run notices` needs only Go. `mise lock` still locks every tool in
      # mise.toml; this list limits what is installed, not what is locked.
      MISE_ENABLE_TOOLS: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not persisted: mise and this branch's own notices task run next, and
          # neither needs the token. Only the push step receives it.
          token: ${{ secrets.FIXIMUS_TOKEN }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          # No install here: with a bumped toolchain, `mise install --locked`
          # fails on exactly the stale lock this job exists to regenerate.
          install: false
          cache: false # this job holds a write token; same reasoning as release.yml

      - name: Regenerate mise.lock
        # The job's token carries no permissions; it only lifts the anonymous
        # GitHub API rate limit for the release lookups `mise lock` makes.
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise lock

      - name: Regenerate THIRD_PARTY_NOTICES.md
        run: mise run notices

      - name: Commit and push if changed
        # Not GITHUB_TOKEN: a push made with it starts no workflows, so the
        # required checks would never run on the regenerated commit and the PR
        # could not merge. The author email must match gitIgnoredAuthors in
        # .github/renovate.json; otherwise Renovate treats the branch as modified
        # and stops rebasing it.
        env:
          FIXIMUS_TOKEN: ${{ secrets.FIXIMUS_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- mise.lock THIRD_PARTY_NOTICES.md)" ]; then
            echo "mise.lock and THIRD_PARTY_NOTICES.md are current"
            exit 0
          fi
          git config user.name "fiximus"
          git config user.email "189535814+fiximus@users.noreply.github.com"
          git add mise.lock THIRD_PARTY_NOTICES.md
          git commit -m "chore(deps): regenerate mise.lock and THIRD_PARTY_NOTICES.md"
          # The header actions/checkout would have persisted, for this push only.
          # Masked because Actions masks the raw secret, not its base64 form, and
          # passed through git's environment config rather than `git -c`, so it
          # stays out of the process arguments any user on the runner can list.
          auth=$(printf 'x-access-token:%s' "$FIXIMUS_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push origin "HEAD:${GITHUB_REF}"
