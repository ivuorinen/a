---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint Code Base
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {} # least privilege by default; the job grants only what it needs
jobs:
  Linter:
    name: PR Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      statuses: write # post the lint result as a commit status
      contents: read # check out the PR to lint it
      packages: read # pull the linter action's dependencies
    steps:
      - name: Run PR Lint
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@12cb8ea3513eae6bb0e20b2f22ef26aace1d51ab # v2026.11.24
