---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate notices
# A Renovate PR that moves the module set leaves THIRD_PARTY_NOTICES.md stale, so
# test.yml's notices check fails it. Renovate's own mechanism for this,
# postUpgradeTasks, does not run here: the Mend-hosted app only executes commands
# Mend has allowlisted. This regenerates the file on Renovate's branches instead.
on:
  push:
    branches: ["renovate/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {} # GITHUB_TOKEN gets nothing; checkout and push use FIXIMUS_TOKEN
jobs:
  notices:
    name: Regenerate third-party notices
    # Renovate's pushes only. This job's own push arrives as fiximus and is
    # skipped, so the workflow cannot retrigger itself.
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not GITHUB_TOKEN: a push made with it starts no workflows, so Test and
          # the required PR Lint would never run on the regenerated commit and the
          # PR could not merge. Persisted because the last step pushes with it.
          token: ${{ secrets.FIXIMUS_TOKEN }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false # this job holds a write token; same reasoning as release.yml

      - name: Regenerate THIRD_PARTY_NOTICES.md
        run: ./scripts/gen-notices.sh

      - name: Commit and push if changed
        # The author email must match gitIgnoredAuthors in .github/renovate.json;
        # otherwise Renovate treats the branch as modified and stops rebasing it.
        run: |
          if [ -z "$(git status --porcelain -- THIRD_PARTY_NOTICES.md)" ]; then
            echo "THIRD_PARTY_NOTICES.md is current"
            exit 0
          fi
          git config user.name "fiximus"
          git config user.email "189535814+fiximus@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          git commit -m "chore(deps): regenerate THIRD_PARTY_NOTICES.md"
          git push origin "HEAD:${GITHUB_REF}"
