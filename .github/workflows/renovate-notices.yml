---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate notices
# A Renovate PR that moves the module set leaves THIRD_PARTY_NOTICES.md stale, so
# test.yml's notices check fails it. Renovate's own mechanism for this,
# postUpgradeTasks, does not run here: the Mend-hosted app only executes commands
# Mend has allowlisted. This regenerates the file on Renovate's branches instead.
on:
  push:
    branches: ["renovate/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {} # GITHUB_TOKEN gets nothing; checkout and push use FIXIMUS_TOKEN
jobs:
  notices:
    name: Regenerate third-party notices
    # No `github.actor == 'renovate[bot]'` gate: the actor is spoofable (zizmor
    # bot-conditions), and it never guarded FIXIMUS_TOKEN -- anyone who can push
    # to renovate/** can read that secret from a workflow of their own. This
    # job's own push starts one more run, which finds the file current and exits.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not persisted: setup-go and this branch's own gen-notices.sh run next,
          # and neither needs the token. Only the push step receives it.
          token: ${{ secrets.FIXIMUS_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false # this job holds a write token; same reasoning as release.yml

      - name: Regenerate THIRD_PARTY_NOTICES.md
        run: ./scripts/gen-notices.sh

      - name: Commit and push if changed
        # Not GITHUB_TOKEN: a push made with it starts no workflows, so the
        # required checks would never run on the regenerated commit and the PR
        # could not merge. The author email must match gitIgnoredAuthors in
        # .github/renovate.json; otherwise Renovate treats the branch as modified
        # and stops rebasing it.
        env:
          FIXIMUS_TOKEN: ${{ secrets.FIXIMUS_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- THIRD_PARTY_NOTICES.md)" ]; then
            echo "THIRD_PARTY_NOTICES.md is current"
            exit 0
          fi
          git config user.name "fiximus"
          git config user.email "189535814+fiximus@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          git commit -m "chore(deps): regenerate THIRD_PARTY_NOTICES.md"
          # The header actions/checkout would have persisted, for this push only.
          # Masked because Actions masks the raw secret, not its base64 form, and
          # passed through git's environment config rather than `git -c`, so it
          # stays out of the process arguments any user on the runner can list.
          auth=$(printf 'x-access-token:%s' "$FIXIMUS_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push origin "HEAD:${GITHUB_REF}"
