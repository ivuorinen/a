---
# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint.json
# golangci-lint configuration for the `a` CLI
# https://golangci-lint.run/usage/configuration/

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  # No `go:` pin -- golangci-lint then reads the version from go.mod, and it is
  # the `go` directive (1.26.0) that it must match, not the newer `toolchain`
  # line: the directive is the language version the compiler applies. A literal
  # here drifted once already, so the analyzers reasoned about different
  # language semantics than the compiler. Leaving it unset is what keeps the two
  # from diverging again when the directive moves, as it did when x/crypto's
  # advisory fix raised the floor to 1.26.0.

linters:
  enable:
    # Essential linters
    - errcheck # Error checking
    - govet # Go vet
    - ineffassign # Inefficient assignment checking
    - staticcheck # Static code analysis
    - unused # Unused variable checking
    - lll # Line length checking
    - gosec # Security checking
    - usetesting # Unit testing
    - revive # Code style checking

    # Code quality linters
    - misspell # Spell checking
    - unconvert # Unconvert checking
    - gocyclo # Cyclomatic complexity checking
    - prealloc # Preallocation checking
    - bodyclose # Body close checking
    - durationcheck # Duration checking
    - errorlint # Error linting
    - predeclared # Predeclared identifier checking
    - wastedassign # Wasted assignment checking
    - errname # Error name checking
    - nilnil # Nil nil checking
    - thelper # Helper function checking
    - usestdlibvars # Use standard library variables
    - whitespace # Whitespace checking
    - godox # TODO/FIXME/etc comments

  # No `disable:` block. `linters.default` is unset, so the baseline is
  # `standard` (errcheck, govet, ineffassign, staticcheck, unused) plus the
  # enable list above -- nothing else is on, so listing linters to disable
  # subtracted nothing. `golangci-lint linters` printed an empty "Disabled by
  # your configuration" section against the 19 entries that used to sit here,
  # which read as 19 deliberate exclusions and were 19 no-ops. The enable list
  # is the whole answer to "what runs here".

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment # Can be too strict for simple structs
        - shadow # Variable shadowing can be acceptable

    gocyclo:
      min-complexity: 20

    misspell:
      locale: US

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    errorlint:
      errorf: false # Allow %v instead of %w for some cases

    lll:
      line-length: 120

formatters:
  enable:
    - gofmt
    - goimports
    - golines

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ivuorinen/a
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
      chain-split-dots: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: true
