---
# Configuration file for MegaLinter
# See all available variables at
# https://megalinter.io/configuration/ and in linters documentation
#
# Read by .github/workflows/pr-lint.yml -> ivuorinen/actions/pr-lint ->
# oxsecurity/megalinter. Nothing in this repo greps as "megalinter": the
# invocation lives inside the external composite action, which is why this file
# once looked unreferenced and was deleted as dead config.
#
# ENABLE_LINTERS below is an allow-list -- deleting it does not disable CI
# linting, it unleashes MegaLinter's full default linter set (GO_GOLANGCI_LINT
# and GO_REVIVE included) on every PR.
APPLY_FIXES: all
SHOW_ELAPSED_TIME: false # Show elapsed time at the end of MegaLinter run
PARALLEL: true
VALIDATE_ALL_CODEBASE: true
FILEIO_REPORTER: false # Generate file.io report
GITHUB_STATUS_REPORTER: true # Generate GitHub status report
IGNORE_GENERATED_FILES: true # Ignore generated files
PRINT_ALPACA: false # Print Alpaca logo in console
SARIF_REPORTER: true # Generate SARIF report
SHOW_SKIPPED_LINTERS: false # Show skipped linters in MegaLinter log
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM
ENABLE_LINTERS:
  - YAML_YAMLLINT
  - MARKDOWN_MARKDOWNLINT
  - YAML_PRETTIER
  - JSON_PRETTIER
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json
FILTER_REGEX_EXCLUDE: >
  (node_modules|\.automation/test)
